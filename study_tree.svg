<svg class="w-full h-auto" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Leaf Vibrant Teal Gradients -->
        <linearGradient id="leafGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5EEAD4" />
            <stop offset="45%" stop-color="#2DD4BF" />
            <stop offset="100%" stop-color="#0F766E" />
        </linearGradient>

        <linearGradient id="leafGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#99F6E4" />
            <stop offset="50%" stop-color="#2DD4BF" />
            <stop offset="100%" stop-color="#14B8A6" />
        </linearGradient>

        <linearGradient id="leafGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2DD4BF" />
            <stop offset="60%" stop-color="#0F766E" />
            <stop offset="100%" stop-color="#042F2E" />
        </linearGradient>

        <!-- Book 3D Hardcover Gradients -->
        <linearGradient id="bookCoverTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#14B8A6" />
            <stop offset="40%" stop-color="#0F766E" />
            <stop offset="100%" stop-color="#042F2E" />
        </linearGradient>

        <linearGradient id="bookSpine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0D9488" />
            <stop offset="50%" stop-color="#0F766E" />
            <stop offset="100%" stop-color="#042F2E" />
        </linearGradient>

        <!-- Pages Turquoise Glowing Gradient -->
        <linearGradient id="bookPages" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5EEAD4" />
            <stop offset="50%" stop-color="#99F6E4" />
            <stop offset="100%" stop-color="#2DD4BF" />
        </linearGradient>

        <!-- Stem Gradient -->
        <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#0F766E" />
            <stop offset="50%" stop-color="#14B8A6" />
            <stop offset="100%" stop-color="#5EEAD4" />
        </linearGradient>
    </defs>

    <!-- ========================================================================= -->
    <!-- LAYER 1: STEMS / BRANCHES -->
    <!-- ========================================================================= -->
    <g stroke="url(#stemGrad)" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Center Stem -->
        <path d="M 235 370 Q 230 260 250 170 Q 260 120 255 70" stroke-width="8" fill="none" />
        <!-- Top Left Branch -->
        <path d="M 240 230 Q 200 170 180 120" stroke-width="6" fill="none" />
        <!-- Mid Left Branch -->
        <path d="M 235 280 Q 180 230 130 190" stroke-width="6" fill="none" />
        <!-- Lower Left Branch -->
        <path d="M 235 320 Q 160 300 110 270" stroke-width="6" fill="none" />
        <!-- Top Right Branch -->
        <path d="M 252 200 Q 300 150 340 100" stroke-width="6" fill="none" />
        <!-- Mid Right Branch -->
        <path d="M 245 260 Q 310 210 380 190" stroke-width="6" fill="none" />
        <!-- Lower Right Branch -->
        <path d="M 240 310 Q 310 280 370 260" stroke-width="6" fill="none" />
    </g>

    <!-- ========================================================================= -->
    <!-- LAYER 2: LEAVES WITH VEINS & HIGHLIGHTS -->
    <!-- ========================================================================= -->
    <!-- 1. Topmost Vertical Leaf -->
    <g>
        <path d="M 255 50 C 290 85 295 135 255 175 C 215 135 220 85 255 50 Z" fill="url(#leafGradMain)" />
        <path d="M 255 50 Q 260 110 255 175" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- 2. Top-Left Leaf -->
    <g>
        <path d="M 175 105 C 190 145 180 185 140 195 C 125 155 135 115 175 105 Z" fill="url(#leafGradLight)" />
        <path d="M 175 105 Q 160 150 140 195" stroke="#CCFBF1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- 3. Top-Right Leaf (Large Arching Leaf) -->
    <g>
        <path d="M 345 85 C 385 115 390 165 350 195 C 310 165 305 115 345 85 Z" fill="url(#leafGradMain)" />
        <path d="M 345 85 Q 350 140 350 195" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- 4. Mid-Left Leaf -->
    <g>
        <path d="M 125 180 C 150 215 145 255 105 265 C 80 230 85 190 125 180 Z" fill="url(#leafGradMain)" />
        <path d="M 125 180 Q 115 222 105 265" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- 5. Mid-Right Leaf (Wide Horizontal Leaf) -->
    <g>
        <path d="M 385 180 C 425 205 425 245 385 260 C 345 235 345 195 385 180 Z" fill="url(#leafGradLight)" />
        <path d="M 385 180 Q 385 220 385 260" stroke="#CCFBF1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- 6. Lower-Left Leaf -->
    <g>
        <path d="M 105 260 C 135 285 130 325 90 335 C 60 310 65 270 105 260 Z" fill="url(#leafGradLight)" />
        <path d="M 105 260 Q 100 297 90 335" stroke="#CCFBF1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- 7. Lower-Right Leaf -->
    <g>
        <path d="M 370 250 C 405 275 400 315 360 325 C 325 300 330 260 370 250 Z" fill="url(#leafGradMain)" />
        <path d="M 370 250 Q 365 287 360 325" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- 8. Small Base Sprout Leaf (Center-Left) -->
    <g>
        <path d="M 220 265 C 235 285 230 310 210 320 C 195 300 200 275 220 265 Z" fill="url(#leafGradDark)" />
    </g>

    <!-- ========================================================================= -->
    <!-- LAYER 3: 3D STACKED HARDCOVER BOOKS -->
    <!-- ========================================================================= -->

    <!-- TOP BOOK -->
    <g id="topBook">
        <!-- Top Book Cover Top Face -->
        <polygon points="260,335 395,305 405,315 270,345" fill="#0D9488" opacity="0.4" />
        <polygon points="245,340 385,310 405,320 265,355" fill="url(#bookCoverTop)" />

        <!-- Top Book Spine Curved Left Edge -->
        <path d="M 245 340 C 230 345 230 365 245 375 L 295 390 C 280 380 280 360 295 350 Z" fill="url(#bookSpine)" />

        <!-- Top Book Pages Block (3D Side & Front) -->
        <path d="M 295 350 L 395 328 L 400 360 L 300 385 Z" fill="url(#bookPages)" />
        <!-- Page Grooves / Paper Lines -->
        <line x1="300" y1="357" x2="395" y2="335" stroke="#0F766E" stroke-width="1.5" opacity="0.5" />
        <line x1="300" y1="365" x2="396" y2="343" stroke="#0F766E" stroke-width="1.5" opacity="0.5" />
        <line x1="300" y1="373" x2="397" y2="351" stroke="#0F766E" stroke-width="1.5" opacity="0.5" />
        <line x1="300" y1="381" x2="398" y2="359" stroke="#0F766E" stroke-width="1.5" opacity="0.5" />

        <!-- Top Book Bottom Cover Rim -->
        <polygon points="295,385 402,360 410,368 300,392" fill="#042F2E" />
    </g>

    <!-- BOTTOM BOOK (Larger Foundation Book) -->
    <g id="bottomBook">
        <!-- Bottom Book Top Cover Surface -->
        <polygon points="120,380 320,340 370,365 170,405" fill="url(#bookCoverTop)" />

        <!-- Bottom Book Left Spine Wrap -->
        <path d="M 120 380 C 95 385 90 415 115 435 L 265 470 C 240 450 245 420 270 405 Z" fill="url(#bookSpine)" />

        <!-- Spine Embossed Accent Stripes -->
        <path d="M 125 390 C 110 395 108 412 122 425" stroke="#14B8A6" stroke-width="3" fill="none" opacity="0.7" />
        <path d="M 140 395 C 125 400 123 417 137 430" stroke="#14B8A6" stroke-width="3" fill="none" opacity="0.7" />

        <!-- Bottom Book Pages Block (Front & Right Edge) -->
        <path d="M 270 405 L 415 375 L 410 425 L 265 460 Z" fill="url(#bookPages)" />

        <!-- Page Texture Lines -->
        <line x1="270" y1="415" x2="412" y2="385" stroke="#0F766E" stroke-width="1.8" opacity="0.5" />
        <line x1="268" y1="425" x2="411" y2="395" stroke="#0F766E" stroke-width="1.8" opacity="0.5" />
        <line x1="267" y1="435" x2="410" y2="405" stroke="#0F766E" stroke-width="1.8" opacity="0.5" />
        <line x1="266" y1="445" x2="409" y2="415" stroke="#0F766E" stroke-width="1.8" opacity="0.5" />
        <line x1="265" y1="455" x2="408" y2="425" stroke="#0F766E" stroke-width="1.8" opacity="0.5" />

        <!-- Bottom Book Base Cover Edge -->
        <polygon points="265,460 410,425 418,435 270,472" fill="#042F2E" />
    </g>
</svg>
