<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Outer Medal Gradient -->
    <linearGradient id="medalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="30%" stop-color="#14b8a6" />
      <stop offset="70%" stop-color="#007a6c" />
      <stop offset="100%" stop-color="#004d40" />
    </linearGradient>

    <!-- Inner Disc Gradient -->
    <radialGradient id="discBg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#005e52" />
      <stop offset="60%" stop-color="#003d33" />
      <stop offset="100%" stop-color="#00241e" />
    </radialGradient>

    <!-- Plant Leaf - Light Side (Mint Highlight) -->
    <linearGradient id="leafLight" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="45%" stop-color="#2dd4bf" />
      <stop offset="85%" stop-color="#99f6e4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Plant Leaf - Shade Side (Deep Teal Glow) -->
    <linearGradient id="leafShade" x1="100%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#044e45" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="90%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Plant Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>

    <!-- Book Covers Gradients -->
    <linearGradient id="bookCoverTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009488" />
      <stop offset="60%" stop-color="#00695c" />
      <stop offset="100%" stop-color="#003d33" />
    </linearGradient>

    <linearGradient id="bookSpine" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00796b" />
      <stop offset="50%" stop-color="#004d40" />
      <stop offset="100%" stop-color="#002822" />
    </linearGradient>

    <!-- Book Pages Gradients -->
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadows for Infinite Crispness -->
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001813" flood-opacity="0.75" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. MEDAL FRAME & OUTER RINGS (100% Vector Geometry) -->
  <!-- ========================================================================= -->
  <circle cx="400" cy="400" r="388" fill="url(#medalRim)" filter="url(#softShadow)" />
  <circle cx="400" cy="400" r="382" fill="none" stroke="#a7f3d0" stroke-width="3" opacity="0.7" />
  
  <!-- Inner Background Core -->
  <circle cx="400" cy="400" r="364" fill="url(#discBg)" />
  <circle cx="400" cy="400" r="354" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.9" />

  <!-- ========================================================================= -->
  <!-- 2. LAUREL WREATH LEAVES (BACKGROUND ACCENTS) -->
  <!-- ========================================================================= -->
  <g fill="#004e42" opacity="0.55">
    <!-- Left Branch -->
    <path d="M 140 380 C 120 340 120 280 155 230 C 145 270 155 320 180 345 Z" />
    <path d="M 160 280 C 138 245 145 185 185 155 C 175 195 190 240 215 255 Z" />
    <path d="M 200 200 C 175 170 200 115 248 100 C 232 140 252 180 272 188 Z" />
    <path d="M 125 460 C 115 420 120 365 150 325 C 145 365 162 405 190 428 Z" />
    <path d="M 135 540 C 128 500 135 445 168 412 C 160 452 180 490 210 505 Z" />

    <!-- Right Branch -->
    <path d="M 660 380 C 680 340 680 280 645 230 C 655 270 645 320 620 345 Z" />
    <path d="M 640 280 C 662 245 655 185 615 155 C 625 195 610 240 585 255 Z" />
    <path d="M 600 200 C 625 170 600 115 552 100 C 568 140 548 180 528 188 Z" />
    <path d="M 675 460 C 685 420 680 365 650 325 C 655 365 638 405 610 428 Z" />
    <path d="M 665 540 C 672 500 665 445 632 412 C 640 452 620 490 590 505 Z" />
  </g>

  <!-- ========================================================================= -->
  <!-- 3. ISOMETRIC STACKED BOOKS (HIGH-PRECISION VECTORS) -->
  <!-- ========================================================================= -->
  <g id="isometric-books">
    <!-- Bottom Book Shadow -->
    <path d="M 215 470 L 415 528 L 730 470 L 735 480 L 415 538 L 215 480 Z" fill="#001813" opacity="0.6" />

    <!-- BOTTOM BOOK: Spine Curve & Left Edge -->
    <path d="M 218 465 C 218 430 250 408 280 408 L 418 464 C 388 464 355 486 355 522 L 218 465 Z" 
          fill="url(#bookSpine)" />
    <!-- Bottom Book Spine Details (Silver Ribbons) -->
    <path d="M 250 416 C 235 432 235 448 250 464" stroke="#5eead4" stroke-width="5" fill="none" opacity="0.9" />
    <path d="M 266 422 C 251 438 251 454 266 470" stroke="#5eead4" stroke-width="5" fill="none" opacity="0.9" />

    <!-- BOTTOM BOOK: Top Cover -->
    <path d="M 280 408 L 600 350 L 736 408 L 418 464 Z" 
          fill="url(#bookCoverTop)" stroke="#2dd4bf" stroke-width="2" />

    <!-- BOTTOM BOOK: White Pages Block -->
    <path d="M 418 464 L 736 408 L 728 464 L 418 522 Z" 
          fill="url(#bookPages)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Page Cut Hatch Lines -->
    <path d="M 432 472 L 720 420 M 432 482 L 720 430 M 432 492 L 720 440 M 432 502 L 720 450 M 432 512 L 720 460" 
          stroke="#94a3b8" stroke-width="1.5" opacity="0.5" />

    <!-- BOTTOM BOOK: Base Rim -->
    <path d="M 218 465 L 418 522 L 728 464 L 736 472 L 418 530 L 218 473 Z" 
          fill="#002d24" />

    <!-- TOP BOOK (SLANTED PERSPECTIVE) -->
    <!-- Top Book Pages Block -->
    <path d="M 434 390 L 632 360 L 624 410 L 434 442 Z" 
          fill="url(#bookPages)" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 444 400 L 618 372 M 444 412 L 618 384 M 444 424 L 618 396 M 444 434 L 618 406" 
          stroke="#94a3b8" stroke-width="1.2" opacity="0.5" />

    <!-- Top Book Top Cover -->
    <path d="M 386 360 L 550 320 L 640 360 L 442 400 Z" 
          fill="url(#bookCoverTop)" stroke="#5eead4" stroke-width="2" />

    <!-- Top Book Spine Curve -->
    <path d="M 386 360 C 370 376 370 416 386 432 L 434 442 L 442 400 Z" 
          fill="url(#bookSpine)" />
    <path d="M 396 372 C 386 386 386 408 396 422" stroke="#5eead4" stroke-width="4" fill="none" opacity="0.9" />
  </g>

  <!-- ========================================================================= -->
  <!-- 4. LUSH GROWING PLANT (PURE VECTOR LEAF PETALS) -->
  <!-- ========================================================================= -->
  <g id="growing-plant">
    
    <!-- Central Main Stem -->
    <path d="M 368 426 C 376 348 392 250 400 120 C 408 250 392 348 382 426 Z" 
          fill="url(#stemGrad)" />

    <!-- ==================== APICAL TOP LEAF (TALL CENTER) ==================== -->
    <!-- Left Half (Bright Mint Gradient) -->
    <path d="M 400 120 C 368 170 352 235 400 315 C 400 235 400 170 400 120 Z" 
          fill="url(#leafLight)" />
    <!-- Right Half (Teal Depth Gradient) -->
    <path d="M 400 120 C 432 170 448 235 400 315 C 400 235 400 170 400 120 Z" 
          fill="url(#leafShade)" />
    <!-- Leaf Center Stem Vein -->
    <path d="M 400 120 L 400 315" stroke="#ffffff" stroke-width="3" opacity="0.85" />

    <!-- ==================== UPPER LEAF PAIR ==================== -->
    <!-- Upper Left Leaf -->
    <path d="M 392 268 C 320 206 224 158 232 158 C 240 190 304 268 384 292 Z" 
          fill="url(#leafLight)" />
    <path d="M 232 158 C 288 190 352 254 388 281" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Upper Right Leaf -->
    <path d="M 408 268 C 480 206 576 158 568 158 C 560 190 496 268 416 292 Z" 
          fill="url(#leafShade)" />
    <path d="M 568 158 C 512 190 448 254 412 281" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8" />

    <!-- ==================== MIDDLE BROAD LEAF PAIR ==================== -->
    <!-- Middle Left Broad Leaf -->
    <path d="M 384 332 C 288 285 184 238 192 254 C 208 318 288 365 376 357 Z" 
          fill="url(#leafLight)" />
    <path d="M 192 254 C 256 285 328 333 381 346" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85" />

    <!-- Middle Right Broad Leaf -->
    <path d="M 416 332 C 512 285 616 238 608 254 C 592 318 512 365 424 357 Z" 
          fill="url(#leafShade)" />
    <path d="M 608 254 C 544 285 472 333 419 346" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85" />

    <!-- ==================== LOWER ACCENT LEAF PAIR ==================== -->
    <!-- Lower Left Leaf -->
    <path d="M 376 380 C 288 365 216 373 224 389 C 248 429 312 429 368 405 Z" 
          fill="url(#leafLight)" />
    <path d="M 224 389 C 280 389 328 397 371 394" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.75" />

    <!-- Lower Right Leaf -->
    <path d="M 408 380 C 496 365 568 373 560 389 C 536 429 472 429 416 405 Z" 
          fill="url(#leafShade)" />
    <path d="M 560 389 C 504 389 456 397 413 394" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.75" />
  </g>

  <!-- ========================================================================= -->
  <!-- 5. TYPOGRAPHY: "Vargshala" & DECORATIVE FLOURISH -->
  <!-- ========================================================================= -->
  <g id="brand-typography" filter="url(#vectorGlow)">
    <!-- Main Bold Brand Wordmark -->
    <text x="400" y="608" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-weight="900" 
          font-size="98" 
          letter-spacing="-2"
          fill="#ffffff">
      Vargshala
    </text>

    <!-- Left Decorative Accent Line -->
    <line x1="200" y1="648" x2="320" y2="648" stroke="#2dd4bf" stroke-width="5.5" stroke-linecap="round" />

    <!-- Center Open Book Silhouette -->
    <path d="M 400 675 C 384 659 344 653 328 656 C 328 668 368 672 400 691 C 432 672 472 668 472 656 C 456 653 416 659 400 675 Z" 
          fill="#5eead4" />
    <path d="M 400 659 C 387 643 355 637 339 640 C 339 650 376 653 400 669 C 424 653 461 650 461 640 C 445 637 413 643 400 659 Z" 
          fill="#ffffff" />

    <!-- Right Decorative Accent Line -->
    <line x1="480" y1="648" x2="600" y2="648" stroke="#2dd4bf" stroke-width="5.5" stroke-linecap="round" />
  </g>

</svg>